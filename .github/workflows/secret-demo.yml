# Lab 14 · step 05 (optional): see how GitHub hides a secret.
# 1. Settings → Secrets and variables → Actions → New repository secret
#    Name: DEMO_SECRET   Secret: any text (not a real password)
# 2. Actions → "Secret demo" → Run workflow
# 3. Open the run: the log shows *** instead of your text.
# This workflow runs only when you click "Run workflow", so it never blocks a deploy.
name: Secret demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-masking:
    runs-on: ubuntu-latest
    steps:
      - name: Print the secret (GitHub masks it)
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then echo "DEMO_SECRET is not set yet (step 1)."; exit 1; fi
          echo "The secret is: $DEMO_SECRET"
          echo "Its length is ${#DEMO_SECRET} characters, but the value never appears in this log."
